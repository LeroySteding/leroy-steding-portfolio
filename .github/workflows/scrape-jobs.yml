name: Scrape Jobs

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      source:
        description: 'Source to scrape (remoteok, all)'
        required: false
        default: 'remoteok'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Scrape RemoteOK jobs
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          cd apps/admin
          npx tsx scripts/scrape-jobs.ts --source=${{ github.event.inputs.source || 'remoteok' }}
      
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.name,
              title: '🚨 Job scraper failed',
              body: `RemoteOK scraper failed in workflow run.
              
              **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Time**: ${new Date().toISOString()}
              **Source**: ${{ github.event.inputs.source || 'remoteok' }}
              
              Please investigate the logs and fix the scraper.`,
              labels: ['scraper', 'critical', 'automated']
            })
